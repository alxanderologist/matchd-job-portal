<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <title>Matchd: Match-a-JOB-today?</title>
</head>
<body class="overflow-hidden">

    <div class="relative min-h-screen w-full overflow-x-hidden flex flex-col justify-between px-6 py-4 md:px-16 md:py-8">

        <img src="images/main-bg.png" 
                alt="matchd-background" 
                class="absolute inset-0 w-full h-full object-cover -z-10 -translate-y-10">

        <header class="flex justify-between items-center w-full z-10">

            <img src="images/matchd-logo-black.png" 
                 alt="matchd-logo-black" 
                 class="h-5 w-auto object-contain">

        </header>

        <main class="w-full max-w-7xl mx-auto my-auto grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-12 items-center py-6">

            <!-- left column -->
            <div class="flex flex-col items-center lg:items-start text-center lg:text-left space-y-6">

                <div class="w-full max-w-xl">
                    <img src="images/match-a-job-today.png" 
                    alt="match a job today?" 
                    class="-translate-y-25 w-full h-auto max-w-xl sm:max-w-2xl">
                </div>

                <p class="" id="desc"></p>

                <!--  Buttons -->
                <div class="flex items-center gap-4 pt-2 -translate-y-25">
                <button class="bg-lime-600 hover:bg-lime-700 text-white font-semibold px-15 py-4 rounded-full shadow-md transition-all">Sign Up</button>
                <button class="bg-white/80 hover:bg-white-700 text-slate-800 font-semibold px-15 py-4 rounded-full border border-slate-300 backdrop-blur-sm shadow-sm transition-all">Log in</button>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
