<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <title>Matchd: Match-a-JOB-today?</title>
</head>
<body class="bg-slate-50 antialiased text-slate-800">

    <div class="relative min-h-screen w-full flex flex-col justify-between px-4 sm:px-8 md:px-16 py-6 sm:py-8">

        <!-- Background Image -->
        <img src="images/main-bg.png" 
             alt="matchd-background" 
             class="absolute inset-0 w-full h-full object-cover -z-10">

        <!-- logo header -->
        <header class="flex justify-between items-center w-full z-10">
            <img src="images/matchd-logo-black.png" 
                 alt="matchd-logo-black" 
                 class="h-6 sm:h-7 w-auto object-contain">
        </header>

        <!--  Content -->
        <main class="w-full max-w-7xl mx-auto my-auto grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12 items-center py-8">

            <!-- Left Column -->
            <div class="flex flex-col items-center lg:items-start text-center lg:text-left space-y-6">

                <!-- matchd a job today image -->
                <div class="w-full max-w-md sm:max-w-xl">
                    <img src="images/match-a-job-today.png" 
                         alt="match a job today?" 
                         class="w-full h-auto object-contain">
                </div>

                <!-- Description of matchd -->
                <p id="desc" class="text-base sm:text-lg max-w-lg text-slate-600"></p>

                <!-- buttons -->
                <div class="flex flex-col sm:flex-row items-center gap-4 w-full sm:w-auto pt-2">
                    <button class="w-full sm:w-auto bg-lime-600 hover:bg-lime-700 text-white font-semibold px-8 sm:px-12 py-3.5 sm:py-4 rounded-full shadow-md transition-all cursor-pointer">
                        Sign Up
                    </button>
                    <button class="w-full sm:w-auto bg-white/80 hover:bg-white text-slate-800 font-semibold px-8 sm:px-12 py-3.5 sm:py-4 rounded-full border border-slate-300 backdrop-blur-sm shadow-sm transition-all cursor-pointer">
                        Log in
                    </button>
                </div>

            </div>


        </main>
    </div>

</body>
</html>
